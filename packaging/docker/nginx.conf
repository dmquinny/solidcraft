# The SolidCraft web app (packaging/docker/Dockerfile).
#
# Caching follows the app's update check (xtask/src/web_offline.rs): index.html, sw.js and
# build.json must always be asked for again, or browsers keep an old build; Trunk's hashed
# files (filehash = true) never change and are kept for a year.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /srv/solidcraft;
    index index.html;

    # Everyone signs in (the users file is kept by `solidcraft-server user add NAME`); the
    # storage service gets the name as X-Remote-User below.
    auth_basic "SolidCraft";
    auth_basic_user_file /srv/history/htpasswd;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json application/manifest+json image/svg+xml font/ttf;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "-[0-9a-f]{16}(_bg)?\.(js|wasm|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Health check (compose overrides the image's): no sign-in needed.
    location = /healthz {
        auth_basic off;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Server storage for designs (a self-hosting patch, apps/solidcraft-web/src/files.rs): the
    # app lists, reads, writes and deletes designs under /files/, and the storage service
    # (apps/solidcraft-server, its own container) answers, keeping every change in a git
    # history with the signed-in user as author. The name resolved at request time (not at
    # start) so nginx comes up even when the service is still starting. `^~` keeps the
    # hashed-asset regex above out of it.
    location ^~ /files/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $design_server "http://solidcraft-server:8782";
        proxy_pass $design_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Remote-User $remote_user;
        proxy_read_timeout 120s;
        client_max_body_size 200m;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
