# Sign-in done by the proxy in front (Authentik's forward auth at Nginx Proxy Manager, or
# Authelia): nginx asks for nothing itself and trusts the user-name header the proxy sets.
# Mount this folder over /etc/nginx/solidcraft to use it:
#   - /mnt/Apps/Apps/solidcraft/packaging/docker/auth/header:/etc/nginx/solidcraft:ro
# Then nothing but that proxy may reach this container: drop its `ports:` mapping (NPM reaches
# it on the compose network), or anyone on the LAN could send the header themselves.
auth_basic off;
