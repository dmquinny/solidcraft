# The user name the proxy signed in, for the storage service (included in the /files/ location).
# Authentik sets X-authentik-username; for Authelia use $http_remote_user instead. The storage
# service answers 401 when the header is missing (unless SOLIDCRAFT_ALLOW_ANONYMOUS=1).
proxy_set_header X-Remote-User $http_x_authentik_username;
proxy_set_header X-Remote-Groups $http_x_authentik_groups;
proxy_set_header X-Remote-Groups $http_x_authentik_groups;
