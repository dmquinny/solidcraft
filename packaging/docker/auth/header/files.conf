# The signed-in user for the storage service (included in the /files/ location), from whichever
# proxy signed them in:
# - Nginx Proxy Manager with Authentik's forward auth sets X-authentik-username (and the groups);
# - a Cloudflare Tunnel behind Cloudflare Access sets Cf-Access-Authenticated-User-Email (the
#   storage service maps that email to the Authentik user name when it reads the directory).
# For Authelia use $http_remote_user in place of the Authentik header. The service answers 401
# when no name arrives (unless SOLIDCRAFT_ALLOW_ANONYMOUS=1). Only those proxies may reach this
# container, or anyone could name themselves: see UPDATING-FROM-UPSTREAM.md, "Authentik".
set $solidcraft_user $http_x_authentik_username;
if ($solidcraft_user = "") {
    set $solidcraft_user $http_cf_access_authenticated_user_email;
}
proxy_set_header X-Remote-User $solidcraft_user;
proxy_set_header X-Remote-Groups $http_x_authentik_groups;
# Where the app's Sign out goes, on this site: Authentik's outpost (the forward-auth recipe
# proxies /outpost.goauthentik.io) or Cloudflare Access. Empty with neither: the service's
# SOLIDCRAFT_LOGOUT_URL is the fallback, and without that the menu says how to sign out.
set $solidcraft_logout "";
if ($http_x_authentik_username != "") {
    set $solidcraft_logout "/outpost.goauthentik.io/sign_out";
}
if ($http_cf_access_authenticated_user_email != "") {
    set $solidcraft_logout "/cdn-cgi/access/logout";
}
proxy_set_header X-Remote-Logout $solidcraft_logout;
